# /etc/nginx/sites-available/api.camsoft.com.co
server {
    listen 80;
    server_name api.camsoft.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.camsoft.com.co;

    # certbot --nginx -d api.camsoft.com.co
    ssl_certificate     /etc/letsencrypt/live/api.camsoft.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.camsoft.com.co/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
