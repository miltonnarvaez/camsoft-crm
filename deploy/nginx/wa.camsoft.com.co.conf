server {
    listen 80;
    server_name wa.camsoft.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wa.camsoft.com.co;

    ssl_certificate     /etc/letsencrypt/live/wa.camsoft.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.camsoft.com.co/privkey.pem;

    location = /camsoft-theme-fix.css {
        alias /var/www/camsoft-crm/deploy/nginx/evolution-theme-fix.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
