server {
    listen 80;
    server_name crm.camsoft.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.camsoft.com.co;

    ssl_certificate     /etc/letsencrypt/live/crm.camsoft.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.camsoft.com.co/privkey.pem;

    root /var/www/camsoft-crm/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
